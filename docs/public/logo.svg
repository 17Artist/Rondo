<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#282438"/>
      <stop offset="100%" stop-color="#151221"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="35%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="512" height="512" rx="100" fill="url(#glow)"/>

  <!-- 外环 -->
  <circle cx="256" cy="240" r="188" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.15"/>

  <!-- 主环 -->
  <circle cx="256" cy="240" r="158" fill="none" stroke="url(#gold)" stroke-width="3.5" opacity="0.4"/>

  <!-- 内环 -->
  <circle cx="256" cy="240" r="138" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.12"/>

  <!-- R 字母 -->
  <g transform="translate(256,240)">
    <path d="
      M -58,-92
      L -58,92
      L -30,92
      L -30,12
      L 14,12
      L 62,92
      L 95,92
      L 44,6
      C 72,-6 88,-30 88,-56
      C 88,-80 68,-92 28,-92
      Z
      M -30,-68
      L 22,-68
      C 48,-68 58,-56 58,-48
      C 58,-34 48,-14 20,-14
      L -30,-14
      Z
    " fill="url(#goldV)"/>
    <!-- 上半高光 -->
    <path d="
      M -58,-92
      L -58,0
      L 95,0
      L 44,6
      C 72,-6 88,-30 88,-56
      C 88,-80 68,-92 28,-92
      Z
      M -30,-68
      L 22,-68
      C 48,-68 58,-56 58,-48
      C 58,-34 48,-14 20,-14
      L -30,-14
      L -30,-68
      Z
    " fill="#FDE68A" opacity="0.12"/>
  </g>

  <!-- 四角装饰点 -->
  <circle cx="256" cy="70" r="3" fill="#FBBF24" opacity="0.35"/>
  <circle cx="256" cy="410" r="3" fill="#B45309" opacity="0.25"/>
  <circle cx="86" cy="240" r="2.5" fill="#FBBF24" opacity="0.2"/>
  <circle cx="426" cy="240" r="2.5" fill="#B45309" opacity="0.2"/>

  <!-- 底部 RONDO -->
  <text
    x="256" y="456"
    font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif"
    font-size="28"
    font-weight="300"
    fill="url(#gold)"
    text-anchor="middle"
    letter-spacing="14"
    opacity="0.5"
  >RONDO</text>
</svg>
