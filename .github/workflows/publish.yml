name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew clean build -Pversion=${{ steps.version.outputs.version }}

      - name: Publish to Maven repository
        env:
          repo: ${{ secrets.MAVEN_REPO_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenRepoUser: admin
        run: ./gradlew deploy -Pversion=${{ steps.version.outputs.version }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rondo-${{ steps.version.outputs.version }}
          path: build/libs/Rondo-${{ steps.version.outputs.version }}.jar
          if-no-files-found: error
