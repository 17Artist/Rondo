# ===================================
# Rondo - 货币兑换规则
# ===================================

exchanges:
  # 点券 -> 金币 (1:100)
  points_to_gold:
    from: points
    to: gold
    rate: 0.01
    min-amount: 100
    max-per-period: -1
    period: NONE
    enabled: true

  # 荣誉点 -> 金币 (1:10)
  honor_to_gold:
    from: honor
    to: gold
    rate: 0.1
    min-amount: 10
    max-per-period: 1000
    period: DAILY
    enabled: true
